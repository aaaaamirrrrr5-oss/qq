const $=s=>document.querySelector(s);

function safeLocalJSON(key,fallback){try{const raw=localStorage.getItem(key);return raw?JSON.parse(raw):fallback}catch(e){return fallback}}

const nativeAdmin=()=>window.Capacitor?.Plugins?.Admin||null;

const siteId=s=>s.id||(s.id=(crypto.randomUUID?crypto.randomUUID():"site-"+Date.now()+"-"+Math.random().toString(36).slice(2)));

   وگرنه بلافاصله پس از واردکردن کد، ذخیرهٔ امن دوباره «قفل» می‌شود و ورود به صفحهٔ بعد انجام نمی‌شود. */
let unlockPromise=null,unlockGraceUntil=0;

async function ensureDeviceUnlock(){
  if(!isNative())return true;
  if(unlockPromise)return unlockPromise;

  if(A.isUnlocked){try{const state=await A.isUnlocked();if(state?.unlocked){nativeUnlocked=true;return true}}catch(e){}}

  unlockPromise=(async()=>{try{await A.unlock();nativeUnlocked=true;return true}finally{unlockGraceUntil=Date.now()+2500;unlockPromise=null}})();

  if(!s)return false;

  if(!isNative())return;

  await ensureDeviceUnlock();

const refreshSessionPromises=new WeakMap();
async function refreshDeviceSession(s){
  if(!s?.refreshToken)throw new Error("نشست منقضی شده است؛ دوباره کلید اتصال را وارد کنید");
  if(refreshSessionPromises.has(s))return refreshSessionPromises.get(s);
  const task=(async()=>{
    const d=await sessionRequest(s,"refresh",{device_id:deviceIdFor(s),refresh_token:s.refreshToken});
    s.accessToken=d.access_token;s.refreshToken=d.refresh_token;s.accessExpiresAt=Date.now()+Number(d.expires_in||900)*1000;s.sessionId=d.session_id||s.sessionId||"";
    await persistSiteKey(s);save();return true;
  })();
  refreshSessionPromises.set(s,task);
  try{return await task}finally{refreshSessionPromises.delete(s)}
}
function requestNonce(){const bytes=new Uint8Array(18);crypto.getRandomValues(bytes);return btoa(String.fromCharCode(...bytes)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/g,"")}

const cacheablePath=p=>/^\/(ping|types|sections|posts(?:\?|$)|products(?:\?|$)|media(?:\?|$)|admin-menu|admin-catalog|widgets)(?:$|\?)/.test(p);
const cachePrefix=s=>"smb_cache_"+btoa(unescape(encodeURIComponent(s.url))).replace(/[^a-z0-9]/gi,"").slice(0,36)+"_";
const cacheKey=(s,path)=>cachePrefix(s)+btoa(unescape(encodeURIComponent(path))).replace(/[^a-z0-9]/gi,"").slice(0,48);
function clearSiteCache(s){try{const p=cachePrefix(s);for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);if(k&&k.startsWith(p))localStorage.removeItem(k)}}catch(e){}}
async function apiRaw(path,body,opts={}){
  if(!S?.url||!hasCredentials(S))throw new Error("اعتبار اتصال در دسترس نیست؛ سایت را دوباره متصل کنید");
  const isAuthPath=String(path).startsWith("/auth/");
  if(S.accessToken&&!isAuthPath&&Number(S.accessExpiresAt||0)<Date.now()+45000)await refreshDeviceSession(S);
  const [p,q]=path.split("?"), url=`${S.url}/?rest_route=/smb/v3${p}${q?"&"+q:""}`;
  const ck=!body&&cacheablePath(path)?cacheKey(S,path):null;
  const send=async()=>{
    const headers={"Content-Type":"application/json","Accept":"application/json"};
    if(S.accessToken&&!isAuthPath){headers.Authorization="Bearer "+S.accessToken;headers["X-SMB-Device"]=deviceIdFor(S);headers["X-SMB-Request-Time"]=String(Math.floor(Date.now()/1000));headers["X-SMB-Request-Nonce"]=requestNonce()}
    else if(S.key)headers["X-SMB-Key"]=S.key;
    const r=await fetch(url,{method:body?"POST":"GET",headers,body:body?JSON.stringify(body):undefined,cache:"no-store"});
    const j=await r.json().catch(()=>({message:"پاسخ نامعتبر؛ افزونه نصب و فعال است؟"}));
    return {r,j};
  };
  try{
    let {r,j}=await send();
    if(r.status===401&&S.accessToken&&S.refreshToken&&!isAuthPath&&!opts.skipRefresh){
      await refreshDeviceSession(S);({r,j}=await send());
    }
    if(!r.ok)throw new Error(j.message||"ارتباط با سایت انجام نشد");
    if(body)clearSiteCache(S);
    if(ck){try{const raw=JSON.stringify({time:Date.now(),data:j});if(raw.length<900000)localStorage.setItem(ck,raw)}catch(e){}}
    return j;
  }catch(e){
    const netErr=e instanceof TypeError||!navigator.onLine;
    if(!body&&ck&&netErr){try{const old=JSON.parse(localStorage.getItem(ck)||"null");if(old?.data&&Date.now()-Number(old.time||0)<7*24*60*60*1000)return {...old.data,_offline:true,_cached_at:old.time}}catch(x){}}
    if(netErr)throw new Error("ارتباط اینترنت برقرار نیست؛ کش معتبر و تازه‌ای برای این بخش پیدا نشد.");
    throw e;
  }
}
const apiMemo=new Map(),apiPending=new Map();
async function api(path,body,opts={}){
  const sid=S?.id||S?.url||'site';
  if(body){const result=await apiRaw(path,body,opts);for(const k of [...apiMemo.keys()])if(k.startsWith(String(sid)+'|'))apiMemo.delete(k);return result;}
  const key=String(sid)+'|'+path,now=Date.now(),cached=apiMemo.get(key);
  if(cached&&cached.until>now)return cached.value;
  if(apiPending.has(key))return apiPending.get(key);
  const task=apiRaw(path,body,opts).then(value=>{apiMemo.set(key,{until:Date.now()+(path==='/ping'?10000:25000),value});return value}).finally(()=>apiPending.delete(key));
  apiPending.set(key,task);return task;
}
async function readOfflineQueue(s){

  try{return JSON.parse(localStorage.getItem(queueAlias(s))||"[]")}catch(e){return []}
}
async function writeOfflineQueue(s,rows){
  if(isNative())return nativeAdmin().saveSecret({alias:queueAlias(s),value:JSON.stringify(rows)});
  localStorage.setItem(queueAlias(s),JSON.stringify(rows));
}
async function queueOffline(path,body){
  const rows=await readOfflineQueue(S);rows.push({path,body,created:Date.now(),title:body.title||body.name||"تغییر آفلاین"});
  await writeOfflineQueue(S,rows);return rows.length;
}
async function syncOfflineQueue(){
  if(syncingQueue||!hasCredentials(S)||!navigator.onLine)return;
  syncingQueue=true;
  try{
    let rows=await readOfflineQueue(S);if(!rows.length)return;
    const pending=[];
    for(const item of rows){
      try{await api(item.path,item.body,{skipQueue:true});toast("یک تغییر آفلاین همگام شد: "+(item.title||"محتوا"))}
      catch(e){pending.push(item);if(e instanceof TypeError||!navigator.onLine)break}
    }
    await writeOfflineQueue(S,pending);
  }finally{syncingQueue=false}
}

async function saveThemeRegisteredSettings(){
  const changes={};
  try{
    THEME_SCHEMA_FIELDS.forEach((f,i)=>{
      if(f.secret||f.readonly)return;
      const el=document.getElementById('ts_'+i);if(!el)return;
      let v;
      if(f.type==='boolean')v=!!el.checked;
      else if(f.type==='integer'){v=Number(el.value);if(!Number.isFinite(v)||!Number.isInteger(v))throw new Error('مقدار عدد صحیح برای '+f.label+' معتبر نیست')}
      else if(f.type==='number'){v=Number(el.value);if(!Number.isFinite(v))throw new Error('مقدار عددی برای '+f.label+' معتبر نیست')}
      else if(f.type==='array'||f.type==='object'){v=JSON.parse(el.value);if((f.type==='array'&&!Array.isArray(v))||(f.type==='object'&&(!v||Array.isArray(v)||typeof v!=='object')))throw new Error('ساختار JSON برای '+f.label+' معتبر نیست')}
      else v=el.value;
      changes[f.id]=v;
    });
  }catch(e){return toast('اعتبارسنجی ناموفق: '+e.message)}
  if(!Object.keys(changes).length)return toast('تنظیم قابل ذخیره‌ای وجود ندارد');
  if(!confirm('تنظیمات ثبت‌شده انتخاب‌شده ذخیره شوند؟'))return;
  try{const r=await api('/registered-settings',{confirm:true,changes});toast(r.message||('ذخیره '+fa(r.saved||0)+' گزینه انجام شد'));themeSchemaView()}catch(e){toast('ذخیره ناموفق: '+e.message)}
}

async function beanoSaveGeneric(key){
  const changes={};
  try{
    GENERIC_SECTION_FIELDS.forEach((f,i)=>{
      if(f.secret||f.readonly||String(f.type||'').toLowerCase()==='password')return;
      const el=document.querySelector(`[data-generic-index="${i}"]`);if(!el)return;
      const type=String(f.type||'text').toLowerCase();let value=(type==='boolean'||type==='bool')?el.checked:el.value;
      if(['number','integer'].includes(type)){value=Number(value);if(!Number.isFinite(value))throw new Error('یکی از مقدارهای عددی معتبر نیست');if(type==='integer')value=Math.trunc(value)}
      if(el.dataset.json==='1')value=JSON.parse(value);
      const id=String(f.id||f.key||'');if(!id)throw new Error('شناسه یک فیلد معتبر نیست');changes[id]=value;
    });
  }catch(e){return toast('اعتبارسنجی فرم ناموفق بود: '+e.message)}
  if(!Object.keys(changes).length)return toast('فیلد قابل ویرایشی برای ذخیره وجود ندارد');
  if(!confirm(`ذخیره ${fa(Object.keys(changes).length)} تنظیمات این بخش انجام شود؟`))return;
  try{const r=await api('/beano/section/'+encodeURIComponent(key),{confirm:true,changes});toast(r.message||'تنظیمات ذخیره شد');openSec(SEC.findIndex(x=>x.key===key))}catch(e){toast(e.message)}
}

function productCsv(){
  shell("ورود و خروج CSV",`<div class="native-head"><div class="ic">📦</div><div class="sp"><b>مدیریت گروهی محصولات</b><div class="m" style="color:#ffffffbd">پیش‌نمایش پیش از هرگونه تغییر</div></div></div>

async function productCsvExport(){
  try{const d=await api("/products/csv");const raw=atob(d.data),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);const blob=new Blob([bytes],{type:d.mime||"text/csv;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=d.filename||"products.csv";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast("فایل CSV آماده شد")}catch(e){toast(e.message)}
}
async function productCsvPreview(file){
  if(!file)return;if(file.size>5*1024*1024)return toast("حداکثر حجم فایل ۵ مگابایت است");
  const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(",")[1]);r.onerror=()=>reject(new Error("خواندن فایل انجام نشد"));r.readAsDataURL(file)});
  try{const d=await api("/products/csv",{data});CSV_PREVIEW=d;$("#csv_result").innerHTML=`<div class="cd"><b>پیش‌نمایش ${fa(d.count)} ردیف</b><div class="m">هیچ محصولی هنوز تغییر نکرده است.</div>${(d.items||[]).slice(0,30).map(x=>`<div class="fld"><b>${esc(x.name)}</b><div class="row"><span class="sp m">${x.id?"شناسه "+fa(x.id):"محصول جدید"}</span><b>${money(x.regular_price)}</b></div></div>`).join("")}<button class="b p" style="width:100%" onclick="productCsvImport()">تأیید و ورود CSV</button></div>`}
  catch(e){toast(e.message)}
}
async function productCsvImport(){
  if(!CSV_PREVIEW?.token||!confirm("تأیید می‌کنید ردیف‌های پیش‌نمایش‌شده به محصولات اضافه یا محصولات موجود به‌روزرسانی شوند؟"))return;
  try{const d=await api("/products/csv",{action:"import",token:CSV_PREVIEW.token,confirm:true});CSV_PREVIEW=null;$("#csv_result").innerHTML=`<div class="cd"><b>${fa(d.imported)} محصول وارد شد.</b>${(d.errors||[]).map(x=>`<p class="m">${esc(x)}</p>`).join("")}</div>`;toast(d.message||"ورود تمام شد")}catch(e){toast(e.message)}
}

function wpOpenFeature(id,meta={}){
 if(id==='dashboard')return home();if(id==='posts')return section('post');if(id==='pages')return section('page');if(id==='media')return media();if(id==='comments')return comments();if(id==='users')return users();
 if(id==='categories')return terms('category','دسته‌های نوشته');if(id==='tags')return terms('post_tag','برچسب‌های نوشته');
 if(id==='menus')return menuManager();if(id==='widgets')return widgetsManager();if(id==='themes')return themes();if(id==='plugins')return pluginsView();
 if(id==='theme-options')return tools2('theme');if(id==='plugin-options')return tools2();
 if(id==='customizer')return panel('customize.php',true,'سفارشی‌ساز پوسته');if(id==='site-editor')return panel('site-editor.php',true,'ویرایشگر کامل سایت');if(id==='patterns')return wnPatterns();
 if(id==='profile')return wnProfile();if(id==='privacy')return wnPrivacy();if(id==='permalinks')return wnPermalinks();
 if(id==='import')return panel('import.php',true,'درون‌ریزی');if(id==='export')return wnExport();if(id==='network')return wnNetwork();if(id==='cron')return wnCron();if(id==='pro-hub')return prHub();if(id==='audit')return prSecurity();if(id==='maintenance')return prMaint();if(id==='login-log')return prLoginLog();if(id==='autoupdates')return prAuto();if(id==='redirects')return prRedirects();if(id==='search-replace')return prSR();if(id==='bulk-posts')return prBulkPosts();if(id==='top-report')return prTop();if(id==='stock')return prStock('low');if(id==='bulk-orders')return prBulkOrders();if(id==='roles')return wnRoles();
 if(id==='wp-settings')return wpSettings();if(id==='registered-settings')return registeredSettings();if(id==='registered-setting')return registeredSettings(meta.query||'');if(id.startsWith('option-group:'))return groupForm(id.slice(13),meta.title||'تنظیمات افزونه');if(id==='admin-menu')return adminMenu();if(id==='api-control')return apiManager();if(id==='security-keys')return securityKeys();if(id==='activity')return activityView();
 if(id==='health')return siteHealth();if(id==='updates')return updatesView();if(id==='tools')return toolsPage();
 if(id.startsWith('type:'))return section(id.slice(5));if(id.startsWith('tax:'))return terms(id.slice(4),meta.title||'طبقه‌بندی');
 if(id.startsWith('admin:'))return panel(meta.slug||id.slice(6),true,meta.title||'بخش پیشخوان');
 if(id==='beano')return secs?beano() : toast('این پوسته بخش اختصاصی قابل کشف ندارد');
 if(id==='woocommerce')return wooHub();
 return toast('این بخش هنوز API بومی شناخته‌شده ندارد؛ از منوی امن پیشخوان بازش کنید.');
}
async function wordpressHome(search=''){
 tab='wordpress';shell('مدیریت وردپرس');$('#v').innerHTML='<div class="ld">در حال کشف امکانات وردپرس و افزونه‌ها…</div>';
 try{
  const [catalog,menus]=await Promise.all([api('/admin-catalog'),api('/admin-menu').catch(()=>({items:[]}))]);WP_CATALOG=catalog;WP_MENUS=menus.items||[];
  const feature=[...WP_FEATURES].filter(x=>(x.id!=='woocommerce'||catalog.modules?.woocommerce)&&(!x.wc||catalog.modules?.woocommerce));
  (catalog.types||[]).filter(t=>!['post','page','product'].includes(t.name)).forEach(t=>feature.push({id:'type:'+t.name,title:t.label||t.name,desc:`نوع محتوای ${t.builtin?'هسته':'اختصاصی'} · ${fa(t.count)} مورد`,icon:'🧱',group:'انواع محتوای اختصاصی',countValue:t.count}));
  (catalog.taxonomies||[]).filter(t=>!['category','post_tag','product_cat','product_tag'].includes(t.name)).forEach(t=>feature.push({id:'tax:'+t.name,title:t.label||t.name,desc:`طبقه‌بندی برای ${(t.object_types||[]).join('، ')}`,icon:'🏷️',group:'طبقه‌بندی‌ها'}));
  if(catalog.modules?.woocommerce){feature.push({id:'tax:product_cat',title:'دسته‌های محصول',desc:'طبقه‌بندی محصولات ووکامرس',icon:'🗂️',group:'فروشگاه'});feature.push({id:'tax:product_tag',title:'برچسب‌های محصول',desc:'برچسب‌گذاری محصولات ووکامرس',icon:'🏷️',group:'فروشگاه'});}
  if(secs)feature.push({id:'beano',title:'تنظیمات اختصاصی '+(secs.theme||'پوسته'),desc:'تنظیمات کشف‌شده از REST پوسته',icon:'☕',group:'پوسته و افزونه'});
  WP_MENUS.forEach(m=>{
    feature.push({id:'admin:'+m.slug,title:m.title,desc:`${(m.children||[]).length} زیرمنو · صفحه اختصاصی پیشخوان`,icon:'▤',group:'صفحات افزونه‌ها و پیشخوان',slug:m.slug});
    (m.children||[]).forEach(c=>feature.push({id:'admin:'+c.slug,title:c.title,desc:`زیرمنوی ${m.title} · صفحه اختصاصی وردپرس/افزونه`,icon:'↳',group:'زیرمنوهای پیشخوان',slug:c.slug}));
  });
  const needle=String(search||'').trim().toLocaleLowerCase('fa');
  const matched=feature.filter(x=>!needle||(x.title+' '+x.desc+' '+x.group).toLocaleLowerCase('fa').includes(needle));
  const groups={};matched.forEach(x=>(groups[x.group]??=[]).push(x));
  const cards=Object.entries(groups).map(([name,items],gi)=>`<div class="wp-group-title">${esc(name)} <small class="m">${fa(items.length)}</small></div><div class="wp-grid">${items.map((x,i)=>{const c=WP_PALETTE[(gi+i)%WP_PALETTE.length];const meta={title:x.title,slug:x.slug||''};return `<div class="wp-card" role="button" tabindex="0" data-search="${esc((x.title+' '+x.desc+' '+x.group).toLocaleLowerCase('fa'))}" onclick="wpOpenFeature(${jsa(x.id)},${ja(meta)})" onkeydown="if(event.key==='Enter')wpOpenFeature(${jsa(x.id)},${ja(meta)})"><div class="row"><div class="wp-ic" style="--x1:${c[0]};--x2:${c[1]}">${esc(x.icon)}</div><span class="sp"></span>${x.countValue!=null?`<span class="wp-count">${fa(x.countValue)}</span>`:(x.count&&catalog.counts?.[x.count]!=null?`<span class="wp-count">${fa(catalog.counts[x.count])}</span>`:'')}</div><b>${esc(x.title)}</b><small>${esc(x.desc)}</small></div>`}).join('')}</div>`).join('');
  $('#v').innerHTML=`<div class="wp-hero"><div class="row"><div class="ic" style="--g1:#ffffff30;--g2:#ffffff17">🌐</div><div class="sp"><b style="font-size:19px">${esc(catalog.site?.name||info.name)}</b><div style="font-size:12px;color:#ffffffc5">مدیریت هسته، افزونه‌ها، پوسته‌ها و تمام منوهای مجاز پیشخوان</div></div><span>WP ${esc(catalog.site?.wp||info.wp)}</span></div><div class="wp-meta"><span>پوسته: ${esc(catalog.site?.theme||info.theme)}</span><span>PHP: ${esc(catalog.site?.php||'')}</span><span>${catalog.site?.wc?'ووکامرس فعال':'بدون ووکامرس'}</span><span>${catalog.site?.multisite?'چندسایتی':'تک‌سایتی'}</span><span>${fa(catalog.settings_count||0)} تنظیمات REST</span></div></div>
  <div class="wp-search"><input id="wp_global_q" placeholder="جستجوی همه بخش‌ها، نوع محتوا و منوها…" value="${esc(search)}" oninput="wpFilterCards(this.value)"></div>
  <div id="wp_feature_groups">${cards||'<div class="ld">موردی مطابق جستجو پیدا نشد.</div>'}</div><div id="wp_dynamic_search"></div>
  <div class="cd"><div class="row"><b class="sp">ابزارهای سریع</b><span class="m">براساس مجوز حساب متصل</span></div><div class="wp-actions"><button class="b" onclick="wpOpenFeature('wp-settings')">تنظیمات وردپرس</button><button class="b" onclick="wpOpenFeature('admin-menu')">همه منوها</button><button class="b" onclick="wpOpenFeature('api-control')">مدیریت API</button></div></div>`;
 }catch(e){$('#v').innerHTML=`<div class="cd">${esc(e.message)}</div><button class="b" onclick="wordpressHome()">تلاش دوباره</button>`}
}
let WP_DYNAMIC_OPTIONS=null,WP_DYNAMIC_GROUPS=null,WP_DYNAMIC_READY=false,WP_GLOBAL_SEARCH_SEQ=0;
function wpFilterCards(q){const v=String(q||'').toLocaleLowerCase('fa').trim();document.querySelectorAll('.wp-card').forEach(x=>x.style.display=!v||x.dataset.search.includes(v)?'flex':'none');document.querySelectorAll('.wp-group-title').forEach(h=>{let n=h.nextElementSibling;h.style.display=n&&[...n.children].some(x=>x.style.display!=='none')?'flex':'none'});if(v.length>=2)wpSearchAllOptions(v).catch(e=>{const r=$('#wp_dynamic_search');if(r)r.innerHTML=`<div class="cd m">جستجوی گزینه‌های تنظیماتی در دسترس نیست: ${esc(e.message)}</div>`});else{WP_GLOBAL_SEARCH_SEQ++;const r=$('#wp_dynamic_search');if(r)r.innerHTML=''}}
async function wpSearchAllOptions(q){
 const root=$('#wp_dynamic_search');if(!root)return;const seq=++WP_GLOBAL_SEARCH_SEQ;
 if(!WP_DYNAMIC_READY){root.innerHTML='<div class="cd m">در حال جستجو در گزینه‌های تنظیماتی مجاز…</div>';const results=await Promise.allSettled([api('/registered-settings'),api('/groups')]);WP_DYNAMIC_OPTIONS=results[0].status==='fulfilled'?(results[0].value.items||[]):[];const raw=results[1].status==='fulfilled'?results[1].value:[];WP_DYNAMIC_GROUPS=Array.isArray(raw)?raw:(raw.items||[]);WP_DYNAMIC_READY=true}
 if(seq!==WP_GLOBAL_SEARCH_SEQ||!$('#wp_dynamic_search'))return;
 const matchSettings=(WP_DYNAMIC_OPTIONS||[]).filter(x=>[x.label,x.id,x.group,x.description].join(' ').toLocaleLowerCase('fa').includes(q)).slice(0,24);
 const matchGroups=(WP_DYNAMIC_GROUPS||[]).filter(x=>[x.name,x.id,x.kind].join(' ').toLocaleLowerCase('fa').includes(q)).slice(0,12);
 let html='';if(matchGroups.length)html+=`<h3 class="wp-group-title">گروه‌های تنظیمات پوسته و افزونه‌ها</h3><div class="wp-grid">${matchGroups.map((x,i)=>{const c=WP_PALETTE[i%WP_PALETTE.length],m={title:x.name,groupId:x.id};return `<div class="wp-card" role="button" tabindex="0" onclick="wpOpenFeature('option-group:'+${jsa(x.id)},${ja(m)})"><div class="wp-ic" style="--x1:${c[0]};--x2:${c[1]}">🧰</div><b>${esc(x.name)}</b><small>${fa(x.count||0)} گزینه · ${esc(x.kind||'')}</small></div>`}).join('')}</div>`;
 if(matchSettings.length)html+=`<h3 class="wp-group-title">گزینه‌های تنظیماتی</h3><div class="wp-grid">${matchSettings.map((x,i)=>{const c=WP_PALETTE[i%WP_PALETTE.length],m={title:x.label,query:x.label+' '+x.id};return `<div class="wp-card" role="button" tabindex="0" onclick="wpOpenFeature('registered-setting',${ja(m)})"><div class="wp-ic" style="--x1:${c[0]};--x2:${c[1]}">⚙️</div><b>${esc(x.label)}</b><small>${esc(x.group||'تنظیمات')} · <span class="ltr">${esc(x.id)}</span></small></div>`}).join('')}</div>`;
 if(!html)html='<div class="cd m">در گزینه‌های تنظیماتی مجاز، موردی مطابق جستجو پیدا نشد. صفحات افزونه‌های دیگر در بخش «تمام منوهای پیشخوان» جستجو می‌شوند.</div>';

let PF="all";
async function pluginsView(){
  shell("افزونه‌ها",null,"hub()");loading();
  try{const l=await api("/plugins"),up=l.filter(p=>p.update).length;
  const v=l.filter(p=>PF==="all"||(PF==="active"&&p.active)||(PF==="off"&&!p.active)||(PF==="up"&&p.update));
  $("#v").innerHTML=`<div class="row"><button class="b p sp" onclick="installer('plugin')">＋ نصب افزونه</button><button class="b sp" onclick="checkUp()">🔄 بررسی</button></div>
  ${up?`<button class="b" style="width:100%;margin-top:8px;color:#e0562f" onclick='updAll(${jattr(l.filter(p=>p.update).map(p=>p.file))})'>⬆️ به‌روزرسانی همهٔ ${fa(up)} افزونه</button>`:""}
  <div class="chips" style="margin-top:8px">${[["all","همه"],["active","فعال"],["off","غیرفعال"],["up","به‌روزرسانی"]].map(a=>`<button class="chip ${PF===a[0]?"on":""}" onclick="PF='${a[0]}';pluginsView()">${a[1]}</button>`).join("")}</div>
  ${v.map(p=>`<div class="cd"><div class="row"><div class="sp"><div class="t ell">${esc(p.name)}</div><div class="m">${esc(p.ver)}${p.update?` · <span style="color:#e0562f">نسخهٔ ${esc(p.update)} موجود</span>`:""}</div></div>
  <label class="sw"><input type="checkbox" ${p.active?"checked":""} onchange="plAct('${esc(p.file)}',this.checked?'activate':'deactivate',true)"><s></s></label></div>
  <div class="row" style="margin-top:8px">${p.update?`<button class="b sp" onclick="plAct('${esc(p.file)}','update')">⬆️ به‌روزرسانی</button>`:""}<button class="b d sp" onclick="if(confirm('افزونه حذف شود؟'))plAct('${esc(p.file)}','delete')">🗑 حذف</button></div></div>`).join("")||`<div class="ld">موردی نیست</div>`}`}catch(e){fail(e)}
}
async function plAct(file,action,quiet){if(action==='delete'&&!confirm('حذف افزونه برای همیشه انجام شود؟'))return;toast("در حال انجام…");try{await api("/plugins/action",{file,action,confirm:action==='delete'});toast("انجام شد");if(!quiet)pluginsView()}catch(e){toast(e.message);pluginsView()}}
async function updAll(fs){for(let i=0;i<fs.length;i++){toast(`به‌روزرسانی ${fa(i+1)} از ${fa(fs.length)}…`);try{await api("/plugins/action",{file:fs[i],action:"update"})}catch(e){toast(e.message)}}toast("پایان");pluginsView()}
async function checkUp(){toast("در حال بررسی…");try{await api("/tools",{action:"check_updates"});pluginsView()}catch(e){toast(e.message)}}

  <input id="iq" placeholder="جستجو در wordpress.org…" onchange="instSearch('${kind}')"><div id="ir"><div class="ld">در حال بارگذاری محبوب‌ها…</div></div>
  <h3>نصب از فایل ZIP (برای افزونه‌های ایرانی و پولی)</h3><input id="iz" class="ltr" placeholder="https://example.com/plugin.zip"><button class="b" style="width:100%" onclick="instZip('${kind}')">نصب و فعال‌سازی از آدرس</button>`);
  instSearch(kind);
}
async function instSearch(kind){
  try{const r=await api(`/${kind}s/search?q=${encodeURIComponent($("#iq")?.value||"")}`);
  $("#ir").innerHTML=r.items.map(x=>`<div class="cd row"><div class="img" style="background-image:url('${esc(x.icon||x.img)}')"></div><div class="sp"><div class="t ell">${esc(x.name)}</div><div class="m ell">⭐ ${fa(x.rating)}${x.installs?" · "+fa(x.installs)+"+ نصب":""}</div></div>
  ${x.have?`<span class="pill s-publish">نصب شده</span>`:`<button class="b p" onclick="instGo('${kind}','${x.slug}')">نصب</button>`}</div>`).join("")||`<div class="ld">نتیجه‌ای نیست</div>`}catch(e){$("#ir").innerHTML=`<div class="cd">${esc(e.message)}</div>`}
}
async function instGo(kind,slug){toast("در حال نصب…");try{await api(`/${kind}s/install`,{slug,activate:false});toast("نصب شد");closeSheet();kind==="plugin"?pluginsView():themes()}catch(e){toast(e.message)}}
async function instZip(kind){const url=$("#iz").value.trim();if(!url)return;toast("در حال نصب…");try{await api(`/${kind}s/install`,{url,activate:true});toast("نصب شد");closeSheet();kind==="plugin"?pluginsView():themes()}catch(e){toast(e.message)}}

/* ---- tools & health ---- */
async function toolsPage(){
  shell("ابزارها و سلامت",null,"hub()");loading();
  try{const r=await api("/tools");

  <h3>عملیات</h3><div class="hub">${T("🧹","پاک‌سازی کش موقت","tool('transients')","#f59e0b","#fbbf24")}${T("🔗","بازسازی پیوندها","tool('flush')","#0b7a62","#14b88f")}${T("🔄","بررسی به‌روزرسانی","tool('check_updates')","#3b82f6","#60a5fa")}${T("🩺","سلامت وردپرس","panel('site-health.php')","#ef4444","#f87171")}${T("📤","خروجی گرفتن","panel('export.php')","#8b5cf6","#a78bfa")}${T("📥","وارد کردن","panel('import.php')","#06b6d4","#22d3ee")}</div>`}catch(e){fail(e)}
}
async function tool(a){toast("در حال انجام…");try{const r=await api("/tools",{action:a});toast(r.msg||"انجام شد")}catch(e){toast(e.message)}}
function mailPage(){
  shell("ایمیل سایت",null,"hub()");
  $("#v").innerHTML=`<div class="cd"><div class="t">ارسال ایمیل آزمایشی</div><p class="m">برای اطمینان از کارکرد SMTP/ایمیل سایت.</p><input id="mt" class="ltr" placeholder="آدرس گیرنده (خالی = ایمیل مدیر)"><button class="b p" style="width:100%" onclick="mailTest()">ارسال</button></div>
  ${info.wc?`<div class="cd row" onclick="wcEmails()"><div class="sp t">📨 ایمیل‌های ووکامرس</div>›</div>`:""}<div class="cd row" onclick="tools2()"><div class="sp"><div class="t">🔧 تنظیمات SMTP و ایمیل پوسته/افزونه‌ها</div><div class="m">در گروه‌های خودکار پوسته و افزونه‌ها</div></div>›</div>`;
}
async function mailTest(){toast("در حال ارسال…");try{const r=await api("/tools",{action:"test_mail",to:$("#mt").value});toast(r.msg)}catch(e){toast(e.message)}}
