name: ساخت اندروید
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read   # کمترین سطح دسترسی برای GITHUB_TOKEN
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: کش Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: نصب وابستگی‌ها
        run: npm install --no-audit --no-fund
      - name: بررسی آسیب‌پذیری وابستگی‌ها (اطلاع‌رسانی)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: بررسی کامل JavaScript و آزمون‌های منطق
        run: npm run check:js
      - name: آزمون‌های DOM ویرایشگر
        run: timeout 180s npm run test --if-present
      - name: آزمون DOM ویرایشگر
        run: npm run test:dom
      - name: آزمون مرورگر (اگر Playwright نصب شده باشد)
        run: npm run test:browser --if-present
      - run: npx --no-install cap add android
      - name: همگام‌سازی نسخهٔ اپ با package.json
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          VERSION_CODE=$(node -e "const [a,b,c]=require('./package.json').version.split('.').map(Number);process.stdout.write(String(a*1000000+b*1000+c))")
          sed -i -E "s/versionCode [0-9]+/versionCode $VERSION_CODE/; s/versionName \"[^\"]+\"/versionName \"$APP_VERSION\"/" android/app/build.gradle
          grep -q "versionName \"$APP_VERSION\"" android/app/build.gradle
      - name: افزودن صفحهٔ بومی مدیریت
        run: |
          D=android/app/src/main/java/ir/sitemanager/app
          cp native/*.java $D/
          M=android/app/src/main/AndroidManifest.xml
          # دریافت متن/لینک از «اشتراک‌گذاری» سایر برنامه‌ها (فقط text/plain) و اجازهٔ اعلان محلی
          sed -i '0,/<\/activity>/s##<intent-filter><action android:name="android.intent.action.SEND"/><category android:name="android.intent.category.DEFAULT"/><data android:mimeType="text/plain"/></intent-filter></activity>#' "$M"
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><application#' "$M"
          sed -i 's#</application>#<activity android:name=".AdminActivity" android:exported="false" android:configChanges="orientation|screenSize|keyboardHidden" android:windowSoftInputMode="adjustResize"/></application>#' "$M"
          # اتصال HTTP فقط برای سایت‌هایی که کاربر آگاهانه با http:// اضافه کند (تأیید در اپ). بدون این ویژگی Android ترافیک HTTP را کاملاً مسدود می‌کند.
          sed -i 's#<application#<application android:usesCleartextTraffic="true"#' "$M"
          # کلید Keystore به دستگاه گره خورده است؛ بکاپ/انتقال ابری داده‌ها فقط داده‌ٔ غیرقابل‌خواندن و نشت احتمالی ایجاد می‌کند.
          if grep -q 'android:allowBackup=' "$M"; then sed -i 's#android:allowBackup="[a-z]*"#android:allowBackup="false"#' "$M"; else sed -i 's#<application#<application android:allowBackup="false"#' "$M"; fi
          grep -q 'android:allowBackup="false"' "$M"
          # فقط CA سیستمی معتبر است (بدون CA کاربر) و هیچ داده‌ای به پشتیبان ابری/انتقال دستگاه نمی‌رود.
          mkdir -p android/app/src/main/res/xml
          cp native/network_security_config.xml native/data_extraction_rules.xml android/app/src/main/res/xml/
          sed -i 's#<application#<application android:networkSecurityConfig="@xml/network_security_config" android:dataExtractionRules="@xml/data_extraction_rules"#' "$M"
          grep -q 'android:networkSecurityConfig' "$M" && grep -q 'android:dataExtractionRules' "$M"
          # برنامه قابل debug از بیرون نباشد (اطمینان از نبودن debuggable در مانیفست)
          ! grep -q 'android:debuggable="true"' "$M"
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: ساخت APK آزمایشی
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: بررسی APK و ثبت شناسهٔ ساخت
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APP_VERSION=$(node -p "require('./package.json').version")
          VERSION_CODE=$(node -e "const [a,b,c]=require('./package.json').version.split('.').map(Number);process.stdout.write(String(a*1000000+b*1000+c))")
          {
            echo "Version Name: $APP_VERSION"
            echo "Version Code: $VERSION_CODE"
            echo "Commit: $GITHUB_SHA"
            echo "Package: ir.sitemanager.app"
            echo "APK SHA-256: $(sha256sum "$APK" | cut -d ' ' -f1)"
            if [ -f package-lock.json ]; then echo "Package Lock SHA-256: $(sha256sum package-lock.json | cut -d ' ' -f1)"; else echo "Package Lock: not generated"; fi
          } > BUILD-METADATA.txt
      - uses: actions/upload-artifact@v4
        with:
          name: site-manager-debug-apk
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            BUILD-METADATA.txt
            package-lock.json
      - name: ساخت نسخهٔ امضاشده (در صورت تنظیم Secrets)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 -d > android/release-key.jks
          cat >> android/app/build.gradle <<'GRADLE'
          android {
            signingConfigs {
              release {
                storeFile file("../release-key.jks")
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
                minifyEnabled false
              }
            }
          }
          GRADLE
          cd android && ./gradlew assembleRelease bundleRelease
      - name: بارگذاری APK و AAB امضاشده
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: site-manager-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
      - name: حذف کلید امضا از runner
        if: ${{ always() }}
        run: rm -f android/release-key.jks
